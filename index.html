<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Contato</title>
  </head>
  <body>
    <div class="box">
      <img src="IMG/aluno-alegre-trabalhando-em-casa.jpg" alt="" />

      <div class="inputs">
        <form action="PHP/envia_form.php" method="POST" id="myForm">
          <div class="estilo-label">
            <label for="nome">Nome</label>
            <input type="text" name="nome" placeholder="Insira seu nome..." />
          </div>

          <div class="estilo-label">
            <label for="email">E-mail</label>
            <input
              type="email"
              name="email"
              placeholder="Insira seu e-mail..."
            />
          </div>

          <div class="estilo-label">
            <label for="assunto">Assunto</label>
            <input
              type="text"
              name="assunto"
              placeholder="Insira o assunto..."
            />
          </div>

          <div class="estilo-label">
            <label for="mensagem">Mensagem</label>
            <textarea
              name="mensagem"
              placeholder="Insira sua mensagem..."
            ></textarea>
          </div>

          <button type="submit">Enviar</button>
        </form>
      </div>
    </div>
    <div id="mensagemRetorno"></div>
  </body>
  <script
    type="text/javascript"
    src="https://code.jquery.com/jquery-3.7.1.min.js"
  ></script>
  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"
  ></script>
  <script type="text/javascript" src="JS/validate.js"></script>
</html>
